{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block content %}
<section class="auth card">
  <p class="step">Step 2 of 2</p>
  <h1>Enter your verification code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for Northfield Portal.</p>
  {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">6-digit code</label>
    <input id="code" name="code" class="otp" inputmode="numeric" pattern="[0-9]*" maxlength="7"
           autocomplete="one-time-code" required autofocus>
    <button class="btn btn-block" type="submit">Verify and sign in</button>
  </form>
  <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="link" type="submit">Cancel and start again</button>
  </form>
</section>
{% endblock %}
