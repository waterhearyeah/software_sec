# TLS termination for the Student Portal (trust boundary TB1).
# Put this line in the http {} block:
#   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Run the app with:  PORTAL_BEHIND_PROXY=1 gunicorn -b 127.0.0.1:8000 'portal:create_app()'
server {
    listen 80;
    server_name portal.example.edu;
    return 308 https://$host$request_uri;        # never serve content over HTTP (ASVS 12.2.1)
}
server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.edu;

    ssl_certificate     /etc/letsencrypt/live/portal.example.edu/fullchain.pem;  # publicly trusted (12.2.2)
    ssl_certificate_key /etc/letsencrypt/live/portal.example.edu/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;               # only current versions, 1.3 preferred (ASVS 12.1.1)
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    client_max_body_size 11m;                    # matches the 10 MB upload limit

    location = /login {
        limit_req zone=login burst=10 nodelay;   # network-level throttle in front of the app's own
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, do not append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
